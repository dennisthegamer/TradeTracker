plugins {
	id 'net.neoforged.moddev'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-neoforge-mc${project.minecraft_version}"
}

repositories {
	mavenCentral()

	// Modrinth Maven for YACL (isXander's Maven no longer hosts the 26.1-line YACL builds)
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
}

// Shared code (common/) is compiled directly into this jar
sourceSets.main {
	java.srcDir rootProject.file('common/src/main/java')
	resources.srcDir rootProject.file('common/src/main/resources')
}

neoForge {
	version = project.neoforge_version

	runs {
		client {
			client()
			gameDirectory = file('run')
			jvmArguments.addAll "--enable-native-access=ALL-UNNAMED", "--add-opens", "java.base/sun.misc=ALL-UNNAMED"
		}
	}

	mods {
		register(project.mod_id) {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// YACL for configuration screen
	implementation "maven.modrinth:yacl:${project.yacl_version}-neoforge"
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
