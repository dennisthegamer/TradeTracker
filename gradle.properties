org.gradle.jvmargs=-Xmx4G --add-opens=java.desktop/javax.imageio.spi=ALL-UNNAMED --add-opens=java.desktop/com.sun.imageio.spi=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Minecraft
minecraft_version=26.2
# Supported MC range (jar name: <mod>-<loader>-<version>+mc<range>.jar)
minecraft_range=26.2

# Fabric Properties
# check these on https://fabricmc.net/develop
loader_version=0.19.3
loom_version=1.17.13

# Fabric API
fabric_api_version=0.152.1+26.2

# NeoForge Properties
# check these on https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml
neoforge_version=26.2.0.10-beta
moddev_version=2.0.141

# Mod Properties
mod_version=1.4.0
mod_id=tradetracker
maven_group=de.dennisthegamer.tradetracker
archives_base_name=tradetracker

# ModMenu (Fabric only)
modmenu_version=20.0.0-beta.3

# YACL (loader suffix -fabric/-neoforge is appended in the subproject build files)
# 3.9.4+26.2 is no longer available on maven.isxander.dev — 3.9.5+26.2 is the oldest hosted 26.2 build
yacl_version=3.9.5+26.2
