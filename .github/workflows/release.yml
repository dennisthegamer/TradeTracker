# Automatically create GitHub releases with build artifacts
# for every push to a Minecraft version branch (mc26.1, mc26.2, ...)

name: Release

on:
  push:
    branches:
      - 'mc*'

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-24.04
    outputs:
      mod_version: ${{ steps.version.outputs.mod_version }}
      minecraft_version: ${{ steps.version.outputs.minecraft_version }}
      fabric_api_version: ${{ steps.version.outputs.fabric_api_version }}
      loader_version: ${{ steps.version.outputs.loader_version }}
      neoforge_version: ${{ steps.version.outputs.neoforge_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version information
        id: version
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          FABRIC_VERSION=$(grep '^fabric_api_version=' gradle.properties | cut -d'=' -f2)
          LOADER_VERSION=$(grep '^loader_version=' gradle.properties | cut -d'=' -f2)
          NEOFORGE_VERSION=$(grep '^neoforge_version=' gradle.properties | cut -d'=' -f2)
          echo "mod_version=$VERSION" >> $GITHUB_OUTPUT
          echo "minecraft_version=$MC_VERSION" >> $GITHUB_OUTPUT
          echo "fabric_api_version=$FABRIC_VERSION" >> $GITHUB_OUTPUT
          echo "loader_version=$LOADER_VERSION" >> $GITHUB_OUTPUT
          echo "neoforge_version=$NEOFORGE_VERSION" >> $GITHUB_OUTPUT
          echo "Extracted versions: mod=$VERSION, minecraft=$MC_VERSION, fabric-api=$FABRIC_VERSION, loader=$LOADER_VERSION, neoforge=$NEOFORGE_VERSION"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Collect jars from both loader subprojects
        run: |
          mkdir -p build/libs
          cp fabric/build/libs/*.jar build/libs/
          cp neoforge/build/libs/*.jar build/libs/
          ls -la build/libs/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ steps.version.outputs.mod_version }}
          path: build/libs/
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ needs.build.outputs.mod_version }}
          path: build/libs/

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${{ needs.build.outputs.mod_version }}"
          CHANGELOG=$(awk "/## \[$VERSION\]/{flag=1; next} /## \[.*\]/{flag=0} flag" CHANGELOG.md | sed '/^$/d')

          if [ -z "$CHANGELOG" ]; then
            echo "Warning: No CHANGELOG entry found for version $VERSION"
            CHANGELOG="No changelog entry available for this version."
          fi

          {
            echo 'changelog<<EOF'
            echo "$CHANGELOG"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Get commits since last release
        id: commits
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag found, including all commits"
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges | head -20)
          else
            echo "Last tag: $LAST_TAG"
            COMMITS=$(git log $LAST_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          {
            echo 'commits<<EOF'
            echo "$COMMITS"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Generate release body
        run: |
          cat << 'RELEASE_BODY' > release_body.md
          ## What's New in v${{ needs.build.outputs.mod_version }}

          ${{ steps.changelog.outputs.changelog }}

          ## Compatibility

          - **Minecraft:** ${{ needs.build.outputs.minecraft_version }}
          - **Fabric Loader:** ${{ needs.build.outputs.loader_version }}+ (Fabric jar)
          - **Fabric API:** ${{ needs.build.outputs.fabric_api_version }} (Fabric jar)
          - **NeoForge:** ${{ needs.build.outputs.neoforge_version }}+ (NeoForge jar)
          - **Java:** 25+

          ## Build Artifacts

          - `tradetracker-fabric-mc${{ needs.build.outputs.minecraft_version }}-${{ needs.build.outputs.mod_version }}.jar` - Fabric mod file
          - `tradetracker-neoforge-mc${{ needs.build.outputs.minecraft_version }}-${{ needs.build.outputs.mod_version }}.jar` - NeoForge mod file
          - `*-sources.jar` - Source code

          ## Recent Commits

          ${{ steps.commits.outputs.commits }}

          ---

          **Installation (Fabric):** Download the Fabric JAR and place it in your mods folder along with Fabric API, ModMenu, and YACL (Fabric).

          **Installation (NeoForge):** Download the NeoForge JAR and place it in your mods folder along with YACL (NeoForge).

          For detailed installation instructions, see the [README](https://github.com/DennisTheGamer/TradeTracker/blob/${{ github.ref_name }}/README.md).
          RELEASE_BODY

      - name: Create Release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.build.outputs.mod_version }}-mc${{ needs.build.outputs.minecraft_version }}
          name: TradeTracker v${{ needs.build.outputs.mod_version }} (MC ${{ needs.build.outputs.minecraft_version }})
          prerelease: false
          body_path: release_body.md
          files: |
            build/libs/tradetracker-*.jar
